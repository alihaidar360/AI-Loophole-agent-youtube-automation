name: Shorts Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for Remotion motion graphics engine)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg (required by Whisper/Remotion)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Restore cached binary assets
        uses: actions/cache@v4
        with:
          path: assets/
          key: shorts-assets-${{ github.run_id }}
          restore-keys: |
            shorts-assets-

      - name: Run Shorts pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python orchestrator_shorts.py

      - name: Commit and push state files (text only — never binaries)
        run: |
          git config user.name "yt-automation-bot"
          git config user.email "actions@github.com"
          git add pipeline_state/job_state.json pipeline_state/published_log.json
          git diff --staged --quiet || git commit -m "chore: update shorts pipeline state [skip ci]"
          git push
