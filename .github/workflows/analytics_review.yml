name: Weekly Analytics Review

on:
  schedule:
    # Every Sunday at 08:00 UTC — after a full week of data since the
    # last review, gives the algorithm time to settle on each video.
    - cron: "0 8 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-analytics-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run weekly analytics analysis
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m modules.analytics

      - name: Commit updated performance insights
        run: |
          git config user.name "yt-automation-bot"
          git config user.email "actions@github.com"
          git add pipeline_state/performance_insights.json
          git diff --staged --quiet || git commit -m "chore: weekly analytics insights update [skip ci]"
          git push
